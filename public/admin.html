<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administração - MJ JOGOS</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><section class="panel">
<h1>👑 Administração MJ JOGOS</h1>
<p>Confirma primeiro no M-Pesa/e-Mola se os 185 MT entraram. Só depois aprova a inscrição.</p>
<label>Acesso de administrador</label><input id="pass" type="password" autocomplete="current-password" placeholder="Acesso de administrador">
<button id="load">Ver inscrições</button><div id="msg"></div><div id="list"></div>
</section></main>
<script>
const $=id=>document.getElementById(id);
function auth(){return {"Authorization":"Bearer "+$("pass").value.trim(),"Content-Type":"application/json"};}
$("load").onclick=async()=>{
 $("msg").textContent="A carregar...";
 try{
  const r=await fetch("/api/admin/players",{headers:auth()}); const d=await r.json();
  if(!r.ok)throw Error(d.error||"Erro");
  $("msg").textContent=d.length+" inscrição(ões).";
  $("list").innerHTML=d.map(p=>`<article class="panel"><b>${safe(p.name)}</b><p>Telefone: ${safe(p.phone)}<br>Inscrição: ${safe(p.id)}<br>Estado: ${p.status==="approved"?"Aprovada":"Pendente"}</p>${p.status==="approved"?`<p>Código: <b>${safe(p.accessCode||"")}</b></p>`:`<button data-id="${safe(p.id)}">CONFIRMAR PAGAMENTO E APROVAR</button>`}</article>`).join("");
  $("list").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>approve(b.dataset.id));
 }catch(e){$("msg").textContent=e.message;}
};
async function approve(id){
 if(!confirm("Confirma que verificaste a entrada dos 185 MT?"))return;
 try{
  const r=await fetch("/api/admin/approve",{method:"POST",headers:auth(),body:JSON.stringify({id})});
  const d=await r.json(); if(!r.ok)throw Error(d.error||"Erro");
  alert("Pagamento aprovado. Código de acesso: "+d.player.accessCode); $("load").click();
 }catch(e){$("msg").textContent=e.message;}
}
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script></body></html>
